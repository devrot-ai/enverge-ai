[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "forgelab"
version = "0.1.0"
description = "Adaptive environment factory for autonomous software engineering agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "ForgeLab Contributors"}
]
keywords = [
    "ai-agents",
    "reinforcement-learning",
    "environment-generation",
    "adaptive-curriculum",
    "failure-attribution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "docker>=7.0.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.2.0",
    "openai>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
train = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "trl>=0.7.0",
    "mlflow>=2.9.0",
    "wandb>=0.16.0",
]

[project.scripts]
forgelab = "forge.cli:main"

[project.urls]
Homepage = "https://github.com/forgelab/forgelab"
Documentation = "https://forgelab.readthedocs.io"
Repository = "https://github.com/forgelab/forgelab"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring Docker",
    "e2e: marks end-to-end acceptance tests",
]

[tool.black]
target-version = ["py311"]
line-length = 120
include = "\\.pyi?$"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "F841", "E402", "UP042"]  # E501: Black handles line length; F841: unused vars in demos; E402: dynamic imports in demo; UP042: StrEnum compatibility

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
follow_imports = "silent"
ignore_missing_imports = true

